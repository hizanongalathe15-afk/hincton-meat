databases:
  - name: hincton-meat-db
    plan: starter
    databaseName: hincton_meat
    user: hincton_meat
    postgresMajorVersion: "17"

services:
  - type: web
    name: hincton-meat-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run render-build
    preDeployCommand: npm run db:push
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hincton-meat-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: hincton-meat-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://hincton-meat-frontend.onrender.com
      - key: BACKEND_URL
        value: https://hincton-meat-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://hincton-meat-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    name: hincton-meat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://hincton-meat-api.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://hincton-meat-api.onrender.com
      - key: VITE_MPESA_ENABLED
        value: "true"
      - key: VITE_NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
