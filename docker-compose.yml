version: '3.8'

services:
  # PostgreSQL Database (for Prisma)
  postgres:
    image: postgres:16
    container_name: premium-meat-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: premium-meat-shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meat-shop-network

  redis:
    image: redis:7-alpine
    container_name: premium-meat-shop-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - meat-shop-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: premium-meat-shop-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000

      # Prisma DB connection
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/premium-meat-shop
      DIRECT_URL: postgresql://postgres:postgres123@postgres:5432/premium-meat-shop
      REDIS_URL: redis://redis:6379

      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRE: 7d
      MPESA_CONSUMER_KEY: your-mpesa-consumer-key
      MPESA_CONSUMER_SECRET: your-mpesa-consumer-secret
      MPESA_PASSKEY: your-mpesa-passkey
      MPESA_SHORTCODE: 174379
      MPESA_CALLBACK_URL: https://your-domain.com/api/mpesa/callback
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: your-email@gmail.com
      EMAIL_PASS: your-app-password
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - meat-shop-network


  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: premium-meat-shop-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - meat-shop-network

volumes:
  postgres_data:
    driver: local


networks:
  meat-shop-network:
    driver: bridge
